# =============================================================================
# active-trace — docker-compose.yml
# Orquesta los servicios de desarrollo/produccion local:
#   api      — FastAPI backend (build desde backend/Dockerfile)
#   postgres — PostgreSQL 16 con volumen persistente y healthcheck
#   worker   — Worker de background jobs (mismo build que api)
#
# Uso:
#   docker-compose up -d                    # levantar todo
#   docker-compose up -d --build            # rebuild y levantar
#   docker-compose logs -f api              # ver logs del API
#   docker-compose down -v                  # bajar y borrar volumenes
#
# Variables de entorno: leer desde .env en backend/.env
# Nunca hardcodear credenciales en este archivo.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # postgres — base de datos PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace}
      POSTGRES_DB: ${POSTGRES_DB:-trace_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trace} -d ${POSTGRES_DB:-trace_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # api — FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Sobreescribir DATABASE_URL para apuntar al servicio postgres del compose
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@postgres:5432/${POSTGRES_DB:-trace_dev}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # worker — background jobs (placeholder; cola real en ADR-003)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@postgres:5432/${POSTGRES_DB:-trace_dev}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Volumenes persistentes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
