<script>
        // OTP Auto-focus and logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Paste logic
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').slice(0, inputs.length).split('');
                pasteData.forEach((char, i) => {
                    if (inputs[i] && /^\d+$/.test(char)) {
                        inputs[i].value = char;
                    }
                });
                if (pasteData.length > 0) {
                    const nextIndex = Math.min(pasteData.length, inputs.length - 1);
                    inputs[nextIndex].focus();
                }
            });
        });

        // Form submission animation
        document.getElementById('verification-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const button = e.target.querySelector('button[type="submit"]');
            button.disabled = true;
            button.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            
            setTimeout(() => {
                button.classList.replace('bg-primary-container', 'bg-green-600');
                button.innerHTML = '<span class="material-symbols-outlined">check_circle</span> <span>Verificado</span>';
            }, 1500);
        });
    </script>
